name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (golden fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e "services/engine[dev]"
      - name: Golden fixtures
        run: cd services/engine && python -m pytest -v
      - name: Lint
        run: cd services/engine && python -m ruff check .
      - name: Types
        run: cd services/engine && python -m mypy weyos_engine backtest
      - name: Backtest smoke run
        # Cheap grid. Catches a harness that has drifted from the engine's trace format or a
        # sweep that no longer reaches every enabled rule.
        run: cd services/engine && python -m backtest run --synthetic --grid quick --quiet

  contract:
    name: Contract (schema is the source of truth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Schemas are valid JSON Schema
        # --strict=false is load-bearing. Both schemas use `format: "date"` / `"date-time"`,
        # and ajv's strict mode treats an unknown format as a compile error — which is why
        # this step exited 1 from the bootstrap commit onward.
        #
        # This step proves the documents are STRUCTURALLY valid JSON Schema. It does not
        # assert formats. Loading ajv-formats here is not currently possible: `-c ajv-formats`
        # fails because ajv-formats v3 exports { default: fn } rather than a bare function,
        # which ajv-cli rejects with "module ajv-formats is invalid; it should export
        # function". Note that nothing else in the repo enforces `format` either — the API's
        # validator does call addFormats(), but the engine's contract tests use jsonschema
        # without a format_checker. Worth an issue; not worth blocking on here.
        run: |
          npx --yes ajv-cli compile --strict=false -s packages/shared-schema/schemas/signal-snapshot.schema.json --spec=draft2020
          npx --yes ajv-cli compile --strict=false -s packages/shared-schema/schemas/decision.schema.json --spec=draft2020

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No rule logic outside the engine
        # The rulebook is config. A threshold comparison against a hard-coded number in the
        # client or the API means someone reimplemented a rule where it cannot be tested.
        run: |
          if grep -rnE "(hrv|rhr|cortisol|hba1c)[^\n]{0,40}(0\.[0-9]|[0-9]{2,})" \
               --include="*.ts" --include="*.tsx" apps services/api 2>/dev/null; then
            echo "::error::Possible rule logic outside services/engine. Rules live in config/rules/."
            exit 1
          fi
      - name: No raw biometrics in log statements
        run: |
          if grep -rnE "console\.(log|info|warn)\([^)]*(snapshot|biometrics|hrv|rhr)" \
               --include="*.ts" --include="*.tsx" apps services 2>/dev/null; then
            echo "::error::Logging biometric data. Log rule ids and deltas only."
            exit 1
          fi
