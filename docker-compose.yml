services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: weyos
      POSTGRES_PASSWORD: weyos_local_only
      POSTGRES_DB: weyos
    ports: ["5432:5432"]
    volumes: ["weyos_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weyos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  weyos_pgdata:

# Local only. Nothing here is a production topology and no real subject data may ever be
# loaded into it — use the simulated personas in services/engine/tests/fixtures.
